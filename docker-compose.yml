services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: regwatch
      POSTGRES_PASSWORD: regwatch
      POSTGRES_DB: regwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://regwatch:regwatch@db:5432/regwatch
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-}
      FETCH_SCHEDULE_HOURS: ${FETCH_SCHEDULE_HOURS:-6}
      DIGEST_TIME_IST: ${DIGEST_TIME_IST:-08:00}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
