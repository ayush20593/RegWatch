<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compliance Monitor</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f1117;
        color: #f4f6fb;
      }
      body {
        margin: 0;
        background: #0f1117;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 36px 20px 60px;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-size: 38px;
      }
      .muted {
        color: #9ba3b4;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .metric,
      .card,
      .filters {
        border: 1px solid #303644;
        background: #141821;
        border-radius: 8px;
      }
      .metric {
        padding: 16px;
      }
      .metric span {
        display: block;
        color: #9ba3b4;
        font-size: 13px;
      }
      .metric strong {
        display: block;
        margin-top: 8px;
        font-size: 28px;
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        padding: 14px;
        margin-bottom: 20px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #303644;
        border-radius: 6px;
        padding: 10px 12px;
        background: #0f1117;
        color: #f4f6fb;
        font-size: 14px;
      }
      .list {
        display: grid;
        gap: 14px;
      }
      .card {
        padding: 18px 20px;
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 21px;
        line-height: 1.3;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
        color: #9ba3b4;
        font-size: 13px;
      }
      .pill {
        border: 1px solid #3b4252;
        border-radius: 999px;
        padding: 3px 9px;
      }
      .summary {
        line-height: 1.55;
        color: #e5e9f2;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      a.button {
        border: 1px solid #47516a;
        border-radius: 6px;
        color: #f4f6fb;
        text-decoration: none;
        padding: 9px 12px;
      }
      .empty {
        border: 1px dashed #47516a;
        border-radius: 8px;
        padding: 28px;
        color: #9ba3b4;
      }
      @media (max-width: 820px) {
        header,
        .filters {
          display: block;
        }
        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .filters > * {
          margin-bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Compliance Monitor</h1>
          <p class="muted">Regulatory updates from RBI, SEBI, IRDAI, and configured sources.</p>
        </div>
        <p class="muted" id="lastUpdated"></p>
      </header>

      <section class="metrics">
        <div class="metric"><span>Total updates</span><strong id="total">0</strong></div>
        <div class="metric"><span>Regulators</span><strong id="regulators">0</strong></div>
        <div class="metric"><span>High risk</span><strong id="highRisk">0</strong></div>
        <div class="metric"><span>With documents</span><strong id="documents">0</strong></div>
      </section>

      <section class="filters">
        <select id="regulator"></select>
        <select id="documentType"></select>
        <select id="riskLevel"></select>
        <input id="search" type="search" placeholder="Search title or summary" />
      </section>

      <section class="list" id="updates"></section>
    </main>

    <script>
      const state = { updates: [] };
      const els = {
        total: document.querySelector("#total"),
        regulators: document.querySelector("#regulators"),
        highRisk: document.querySelector("#highRisk"),
        documents: document.querySelector("#documents"),
        regulator: document.querySelector("#regulator"),
        documentType: document.querySelector("#documentType"),
        riskLevel: document.querySelector("#riskLevel"),
        search: document.querySelector("#search"),
        updates: document.querySelector("#updates"),
        lastUpdated: document.querySelector("#lastUpdated"),
      };

      function unique(values) {
        return [...new Set(values.filter(Boolean))].sort();
      }

      function optionList(select, label, values) {
        select.innerHTML = [`<option value="">${label}</option>`]
          .concat(values.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`))
          .join("");
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function formatDate(value) {
        if (!value) return "Date not available";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
      }

      function filteredUpdates() {
        const search = els.search.value.trim().toLowerCase();
        return state.updates.filter((item) => {
          if (els.regulator.value && item.regulator !== els.regulator.value) return false;
          if (els.documentType.value && item.document_type !== els.documentType.value) return false;
          if (els.riskLevel.value && item.risk_level !== els.riskLevel.value) return false;
          if (search) {
            const text = `${item.title || ""} ${item.summary || ""}`.toLowerCase();
            if (!text.includes(search)) return false;
          }
          return true;
        });
      }

      function render() {
        const updates = filteredUpdates();
        els.total.textContent = updates.length;
        els.regulators.textContent = unique(updates.map((item) => item.regulator)).length;
        els.highRisk.textContent = updates.filter((item) => item.risk_level === "High").length;
        els.documents.textContent = updates.filter((item) => item.pdf_url || item.page_url).length;

        if (!updates.length) {
          els.updates.innerHTML = `<div class="empty">No updates match the current filters.</div>`;
          return;
        }

        els.updates.innerHTML = updates
          .map((item) => {
            const documentUrl = item.pdf_url || item.page_url || "";
            const sourceUrl = item.page_url && item.page_url !== item.pdf_url ? item.page_url : "";
            return `
              <article class="card">
                <h2>${escapeHtml(item.title || "Untitled update")}</h2>
                <div class="meta">
                  <span class="pill">${escapeHtml(item.regulator || "Unknown")}</span>
                  <span class="pill">${escapeHtml(item.document_type || "Other")}</span>
                  <span class="pill">${escapeHtml(item.risk_level || "Low")} risk</span>
                  <span>${escapeHtml(formatDate(item.date))}</span>
                </div>
                <div class="summary">${escapeHtml(item.summary || "No summary available.")}</div>
                <div class="actions">
                  ${documentUrl ? `<a class="button" href="${escapeHtml(documentUrl)}" target="_blank" rel="noreferrer">Open document</a>` : ""}
                  ${sourceUrl ? `<a class="button" href="${escapeHtml(sourceUrl)}" target="_blank" rel="noreferrer">Open source page</a>` : ""}
                </div>
              </article>
            `;
          })
          .join("");
      }

      async function init() {
        const response = await fetch("/api/updates");
        state.updates = await response.json();
        state.updates.sort((a, b) => String(b.date || b.detected_at || "").localeCompare(String(a.date || a.detected_at || "")));

        optionList(els.regulator, "All regulators", unique(state.updates.map((item) => item.regulator)));
        optionList(els.documentType, "All document types", unique(state.updates.map((item) => item.document_type)));
        optionList(els.riskLevel, "All risk levels", unique(state.updates.map((item) => item.risk_level)));
        els.lastUpdated.textContent = `Loaded ${state.updates.length} updates`;
        render();
      }

      [els.regulator, els.documentType, els.riskLevel, els.search].forEach((el) => {
        el.addEventListener("input", render);
      });

      init().catch(() => {
        els.updates.innerHTML = `<div class="empty">Unable to load updates.</div>`;
      });
    </script>
  </body>
</html>
