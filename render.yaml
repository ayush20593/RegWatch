services:
  - type: web
    name: regwatch
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: regwatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FETCH_SCHEDULE_HOURS
        value: "6"
      - key: DIGEST_TIME_IST
        value: "08:00"
      - key: BREVO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: DEMO_ADMIN_EMAIL
        value: "demo@regwatch.app"
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: regwatch-db
    plan: free
